# Gate de PR e de main: a suite do ETL contra um Postgres recém-migrado e o typecheck do servidor MCP.
# Sem segredo nenhum: o banco é o serviço do próprio job. Nada aqui toca produção.
#
# Banco do CI = db/migrate.sh --local + seed + etl/tests/fixtures/base.sql (país, regiões, UFs, Câmara e Senado).
# Regressões que conferem dado real (fixture `carga`) pulam com "banco sem carga"; rodam no banco local carregado.
# Teste pulado por "banco indisponível" é falha: sem isso o resumo sai verde sem um único teste de banco ter rodado.
# Os testes do MCP (mcp/test) pedem o banco carregado e por isso não entram; aqui só o typecheck.
# Actions fixadas por SHA (tag no comentário).
name: ci
on:
  pull_request:
  push:
    branches: [main]
# Na main nenhum run é cancelado: cada commit mergeado termina o próprio gate. Em PR, o push mais novo cancela o anterior.
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: ${{ github.ref != 'refs/heads/main' }} }
permissions: { contents: read }

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: civico }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/civico
      ETL_DATABASE_URL: postgres://postgres:postgres@localhost:5432/civico
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: etl/uv.lock
      - name: migrações
        run: db/migrate.sh --local
      - name: dependências (uv.lock)
        working-directory: etl
        run: uv sync --frozen --extra dev
      - name: seed e base de teste
        working-directory: etl
        run: |
          uv run --frozen civico-etl seed
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -f tests/fixtures/base.sql
      - name: pytest
        working-directory: etl
        run: |
          set -o pipefail
          uv run --frozen pytest -q -rs | tee "$RUNNER_TEMP/pytest.txt"
          if grep -q "banco indisponível" "$RUNNER_TEMP/pytest.txt"; then
            echo "::error::testes de banco pulados: o Postgres do job não respondeu"
            exit 1
          fi

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: mcp } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: npm ci
      - run: npm run typecheck

  # Gate do web/ (Next 15, React 19). Sem segredo e sem banco: o build e os e2e usam a FONTE DEMO
  # (DATA_SOURCE=demo, ALLOW_DEMO_DATA=1). Fontes vêm do Fontsource; nada busca fonte na rede.
  # Três jobs em paralelo: verificação estática, build de produção e e2e (o webServer do Playwright faz o próprio build).
  web-verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: eslint
        run: npx eslint src
      - name: tsc
        run: npx tsc --noEmit
      - name: testes unitários
        run: npm run test:unit

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: web } }
    env:
      DATA_SOURCE: demo
      ALLOW_DEMO_DATA: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: cache do Next (.next/cache)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}-
      - name: next build
        run: npx next build

  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: versão do Playwright
        id: pw
        run: echo "versao=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: cache dos navegadores
        id: pwcache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.versao }}
      # projetos desktop e mobile (Pixel 7) usam chromium; o headless shell é o que o modo headless executa (BUG-003)
      - name: navegadores do Playwright (com dependências do sistema)
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium chromium-headless-shell
      - name: dependências do sistema (navegadores em cache)
        if: steps.pwcache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # o webServer do config faz `next build && next start -p 3200` com NEXT_DIST_DIR=.next-e2e e DATA_SOURCE=demo
      - name: e2e (fonte demo)
        run: npx playwright test
        env:
          CI: "true"
      - name: relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
          if-no-files-found: ignore
