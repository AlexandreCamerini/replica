# Avaliação da verificação agêntica antes de ligar a publicação por agentes (§10 de replica/verificacao-agentica.md).
#
# SÓ MANUAL (workflow_dispatch): sem cron, sem banco. Nenhum passo lê ETL_DATABASE_URL nem escreve em banco; o harness
# (etl/evals/verificacao_eval.py) chama `jobs.verificar.verify`, que é puro, e grava tudo em arquivo. A publicação por agentes
# continua desligada: nada aqui define VERIFICACAO_AGENTICA nem toca pipeline_switches.
#
# Custo: o harness confere o teto ANTES de cada chamada com o pior caso dela (entrada estimada + 16 mil tokens de saída) e
# para quando não cabe, gravando o parcial. Ordem: injeção -> armadilhas -> segunda passada -> campos reais (só se pedida em
# `fases`); 25% do teto
# fica reservado para a segunda passada (concordância consigo mesmo). O artifact sai mesmo quando o run para no teto.
# ANTHROPIC_API_KEY só no passo do harness.
name: verificação · avaliação

on:
  workflow_dispatch:
    inputs:
      conjunto:
        description: "ajuste (para mexer em prompt) ou medida (a barra da §10; não ajustar nada com ele)"
        required: true
        type: choice
        options: [medida, ajuste]
        default: medida
      limite:
        description: "No máximo N casos distintos na primeira passada (vazio = todos os que couberem no teto)"
        required: false
        default: ""
      teto_usd:
        description: "Teto de gasto em US$ deste run (máximo 50)"
        required: true
        default: "20"
      fases:
        description: "Fases, separadas por vírgula, entre injecao,armadilhas,segunda,reais (reais só roda se pedida)"
        required: true
        default: "injecao,armadilhas,segunda"
      n_segunda:
        description: "Armadilhas que ganham a segunda passada (a injeção ganha sempre); 0 a 500"
        required: true
        default: "10"

concurrency:
  group: verificacao-eval
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  avaliar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: etl
    env:
      CONJUNTO: ${{ inputs.conjunto }}
      LIMITE: ${{ inputs.limite }}
      TETO: ${{ inputs.teto_usd }}
      FASES: ${{ inputs.fases }}
      N_SEGUNDA: ${{ inputs.n_segunda }}
    steps:
      - name: Entradas válidas?
        working-directory: ${{ github.workspace }}
        run: |
          case "$CONJUNTO" in ajuste|medida) ;; *) echo "::error::conjunto inválido: '$CONJUNTO'"; exit 1;; esac
          case "$LIMITE" in '') ;; *[!0-9]*) echo "::error::limite inválido: '$LIMITE'"; exit 1;; esac
          if [ -n "$LIMITE" ] && [ "$LIMITE" -le 0 ]; then echo "::error::limite precisa ser positivo"; exit 1; fi
          if ! printf '%s' "$TETO" | grep -Eq '^[0-9]+(\.[0-9]+)?$'; then echo "::error::teto inválido: '$TETO'"; exit 1; fi
          if ! awk -v t="$TETO" 'BEGIN { exit !(t > 0 && t <= 50) }'; then echo "::error::teto fora de (0, 50]"; exit 1; fi
          f='(injecao|armadilhas|segunda|reais)'
          if ! printf '%s' "$FASES" | grep -Eq "^$f(,$f)*\$"; then echo "::error::fases inválidas: '$FASES'"; exit 1; fi
          if ! printf '%s' "$N_SEGUNDA" | grep -Eq '^[0-9]{1,3}$' || [ "$N_SEGUNDA" -gt 500 ]; then echo "::error::n_segunda inválido: '$N_SEGUNDA'"; exit 1; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: etl/uv.lock
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: etl/.cache
          key: etl-http-verificacao-eval-${{ github.run_id }}
          restore-keys: etl-http-verificacao-eval-
      - name: dependências (uv.lock)
        run: uv sync --frozen
      - name: Estimativa (nenhuma chamada)
        run: uv run --frozen python -m evals.verificacao_eval estimar --conjunto "$CONJUNTO" --teto-usd "$TETO" --fases "$FASES" --n-segunda "$N_SEGUNDA" ${LIMITE:+--limite "$LIMITE"} | tee "$RUNNER_TEMP/plano.json"
      - name: Avaliar (API real)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::error::falta o secret ANTHROPIC_API_KEY"; exit 1; fi
          args=(rodar --conjunto "$CONJUNTO" --teto-usd "$TETO" --fases "$FASES" --n-segunda "$N_SEGUNDA" --confirmo-custo --saida "$RUNNER_TEMP/saida" --paralelo 4)
          [ -n "$LIMITE" ] && args+=(--limite "$LIMITE")
          set +e
          uv run --frozen python -m evals.verificacao_eval "${args[@]}"
          rc=$?
          set -e
          # 3 = parou no teto ou no limite (parcial, esperado); qualquer outro código diferente de 0 é falha
          if [ "$rc" -eq 3 ]; then echo "::warning::resultado PARCIAL: teto ou limite atingido; veja relatorio.md"; exit 0; fi
          exit "$rc"
      - name: Resumo
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/saida/relatorio.md" ]; then cat "$RUNNER_TEMP/saida/relatorio.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Publicar resultado (artifact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verificacao-eval-${{ inputs.conjunto }}-${{ github.run_id }}
          path: ${{ runner.temp }}/saida
          if-no-files-found: warn
          retention-days: 90
